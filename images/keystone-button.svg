<svg xmlns="http://www.w3.org/2000/svg" width="420" height="76" viewBox="0 0 420 76" role="img" aria-label="Try Keystone: live AI demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6e63"/>
      <stop offset="0.5" stop-color="#128a77"/>
      <stop offset="1" stop-color="#4453c9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="4" y="4" width="412" height="68" rx="34"/></clipPath>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="412" height="68" rx="34" fill="url(#bg)"/>
  <g clip-path="url(#pill)">
    <rect x="-160" y="0" width="140" height="76" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-180;560" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="4.5" y="4.5" width="411" height="67" rx="33.5" fill="none" stroke="#fff" stroke-opacity="0.25"/>
  <!-- keystone mark -->
  <g transform="translate(26,16)">
    <circle cx="22" cy="22" r="22" fill="#fff" fill-opacity="0.16"/>
    <path d="M14 8h16l-3.5 14h-9z" fill="#fff"/>
    <path d="M8 36V25l6-2 3.5 13zM36 36V25l-6-2-3.5 13z" fill="#fff" fill-opacity="0.75"/>
    <circle cx="22" cy="22" r="22" fill="none" stroke="#fff" stroke-opacity="0.5">
      <animate attributeName="r" values="22;27;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="86" y="35" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" filter="url(#glow)">Try Keystone</text>
  <text x="86" y="55" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#e6fffa" fill-opacity="0.92">Live AI demo · runs free in your browser</text>
  <!-- arrow -->
  <g transform="translate(362,38)">
    <circle r="18" fill="#fff" fill-opacity="0.18"/>
    <path d="M-6 0h12M1 -6l6 6-6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
